name: detunnel

services:
  detunnel:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${DETUNNEL_PORT:-18765}:18765"
    environment:
      NODE_ENV: production
      DETUNNEL_HOST: 0.0.0.0
      DETUNNEL_PORT: 18765
      DETUNNEL_WORKSPACE: /workspace
      DETUNNEL_DATA_PATH: /root/.detunnel
      DETUNNEL_PROFILE: ${DETUNNEL_PROFILE:-balanced}
      DETUNNEL_FULL_BYPASS: ${DETUNNEL_FULL_BYPASS:-0}
      DETUNNEL_UNRESTRICTED: ${DETUNNEL_UNRESTRICTED:-0}
    volumes:
      - ../workspace:/workspace
      - detunnel-data:/root/.detunnel
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18765/_detunnel/identity').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  detunnel-data:
    name: detunnel-data
