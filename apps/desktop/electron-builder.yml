appId: com.detunnel.desktop
productName: detunnel
asar: true
npmRebuild: false
directories:
  output: dist/installers
  buildResources: build
files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
  - build/icon.ico
  - build/icon.png
  - package.json
publish:
  provider: github
  owner: engasnm111
  repo: detunnel
  releaseType: release
afterPack: scripts/capture-packaged-runtime-evidence.mjs
afterSign: scripts/capture-packaged-runtime-evidence.mjs
extraResources:
  - from: build/capability-bridge/windows-capability-bridge.ps1
    to: windows-capability-bridge.ps1
  - from: build/capability-bridge/windows-capability-bridge.sha256
    to: windows-capability-bridge.sha256
  - from: build/capability-bridge/windows-capability-bridge.integrity.json
    to: windows-capability-bridge.integrity.json
  - from: ../../native/windows-ocr/bin
    to: windows-ocr
  - from: build/tunnel-client
    to: tunnel-client
  - from: build/runtime-tools
    to: runtime-tools
  - from: ../../.agents/skills/detunnel-scheduled-continuation
    to: agent-skills/detunnel-scheduled-continuation
# Tunnel profile expects these next to detunnel.exe (not only under resources/).
extraFiles:
  - from: build/detunnel-mcp-stdio.cjs
    to: detunnel-mcp-stdio.cjs
  - from: build/detunnel-mcp-stdio.cmd
    to: detunnel-mcp-stdio.cmd
  - from: build/detunnel-node.exe
    to: detunnel-node.exe
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: detunnel-Setup-${version}.${ext}
  # Keep the branded icon embedded in detunnel.exe for Windows shortcuts and taskbar.
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  # Preserve the historical per-user default (%LOCALAPPDATA%\Programs\detunnel).
  # All-users remains an explicit installer-page choice instead of the default.
  selectPerMachineByDefault: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  # Create the Start Menu link in installer.nsh from $INSTDIR so no build-user path can be baked in.
  createStartMenuShortcut: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  uninstallDisplayName: ${productName}
  include: build/installer.nsh
portable:
  artifactName: detunnel-Portable-${version}.${ext}
